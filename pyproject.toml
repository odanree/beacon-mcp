[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon-mcp"
version = "0.3.0"
description = "MCP server wrapping the Beacon job-search-pipeline API so Claude Code can add projects, search jobs, score resumes, and pull JD insights without curl-and-cookie gymnastics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Danh Le", email = "nightseek@yahoo.com" }]
keywords = ["mcp", "model-context-protocol", "claude", "anthropic", "job-search", "resume"]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # `server.listener` opens a persistent LISTEN connection to Beacon's
    # Postgres to trigger event-driven RAG rebuilds. Only needed when
    # running the listener process; the MCP server itself doesn't touch
    # asyncpg directly.
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
beacon-mcp = "server.main:main"
beacon-mcp-listener = "server.listener:main"

[project.urls]
Homepage = "https://github.com/odanree/beacon-mcp"
Repository = "https://github.com/odanree/beacon-mcp"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
